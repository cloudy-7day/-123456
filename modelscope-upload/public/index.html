<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>门店增长智能体 · 链路验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#1e293b;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid #e2e8f0;padding:24px max(24px,calc((100vw - 1200px)/2))}h1{font-size:24px;margin:0}header p{margin:5px 0;color:#64748b}main{max-width:1248px;padding:24px;margin:auto;display:grid;grid-template-columns:350px 1fr;gap:24px}.panel,.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:16px}label{display:block;margin:0 0 16px;font-weight:600}input,textarea,select{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}textarea{min-height:90px;resize:vertical}button{cursor:pointer;border:0;border-radius:7px;background:#a51d2d;color:white;padding:10px 16px;font:inherit}button.secondary{background:#e2e8f0;color:#334155}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:8px;flex-wrap:wrap}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:12px 0 4px}.muted,small{color:#64748b}#progress{white-space:pre-wrap;color:#475569;font-size:13px}pre,.text{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.images{display:flex;gap:12px;flex-wrap:wrap}figure{margin:0;max-width:200px}figure img{width:100%;height:150px;object-fit:contain;background:#f8fafc}figcaption{font-size:12px;overflow-wrap:anywhere}.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:6px}#connection{margin-top:12px;font-size:13px}details summary{cursor:pointer}.notice{padding:12px;background:#fff7ed;border-radius:8px;color:#9a3412;margin-bottom:16px}@media(max-width:800px){main{grid-template-columns:1fr}header{padding:20px}}
</style>
<header><h1>门店增长智能体</h1><p>输入客户场景，生成有资料依据的内容、演示建议和跟进计划。</p></header>
<main>
<aside><form id="task" class="panel"><h2>本次任务</h2><div id="fields"></div><button id="submit">生成销售内容</button></form><div class="panel"><div class="toolbar"><button id="check" class="secondary">检查连接</button><button id="latest" class="secondary">上次结果</button></div><div id="connection">点击检查知识库和模型连接。</div><div id="progress" role="status"></div></div></aside>
<section><div class="notice">当前为链路验证版。报价规则待补充；生成结果须人工检查后使用。</div><div class="toolbar"><button id="copy" class="secondary" disabled>复制文案</button><button id="download" class="secondary" disabled>下载完整结果</button></div><div id="result" style="margin-top:16px"><div class="card muted">填写左侧输入卡，开始一次真实运行。</div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let contracts,current;
const make=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node};
function showError(message){$('result').replaceChildren(make('div',message,'error'))}
function renderValue(parent,value,schema){
 if(Array.isArray(value)){if(!value.length)parent.append(make('p','暂无','muted'));for(const item of value){const box=make('div');box.style.marginBottom='12px';renderValue(box,item,schema?.items);parent.append(box)}}
 else if(value&&typeof value==='object'){for(const [key,v] of Object.entries(value)){parent.append(make('h3',schema?.properties?.[key]?.title||key));renderValue(parent,v,schema?.properties?.[key])}}
 else parent.append(make('div',String(value??''),'text'));
}
function render(result){
 current=result;$('result').replaceChildren();
 if(result.delivery){const state=make('div',undefined,result.delivery.status==='blocked'?'error':'notice');state.append(make('p',result.delivery.status==='blocked'?'已暂停成稿，请先核对资料。':result.delivery.status==='needs_images'?'文字草稿已生成，配图待补。':'已生成草稿，使用前请核验。'));for(const reason of result.delivery.reasons)state.append(make('p',reason));$('result').append(state)}
 for(const [key,value] of Object.entries(result.output)){const card=make('div',undefined,'card');card.append(make('h2',contracts.output.properties[key]?.title||key));renderValue(card,value,contracts.output.properties[key]);$('result').append(card)}
 const evidence=make('div',undefined,'card');evidence.append(make('h2','资料依据与图片'));
 const images=make('div',undefined,'images');
 for(const source of result.sources){if(source.kind==='image'){const figure=make('figure');const img=make('img');img.src='/media/'+source.local_path.split('/').pop();img.alt=source.title;figure.append(img,make('figcaption',source.ref+' · '+source.title));images.append(figure)}else{const detail=make('details');detail.append(make('summary',source.ref+' · '+source.title),make('small',source.path),make('pre',source.text));evidence.append(detail)}}
 evidence.append(images);$('result').append(evidence);
 const check=make('div',undefined,'card');check.append(make('h2','检查与运行记录'),make('p',result.checks.note));
 check.append(make('p',`来源 ${result.sources.length} 份 · 耗时 ${(result.meta.duration_ms/1000).toFixed(1)} 秒 · 模型 ${result.meta.model||''}`,'muted'));
 for(const warning of result.meta.warnings||[])check.append(make('p',warning,'error'));
 $('result').append(check);$('copy').disabled=result.delivery?.status==='blocked';$('download').disabled=false;
}
async function init(){contracts=await fetch('/api/contracts').then(r=>r.json());for(const [key,schema] of Object.entries(contracts.input.properties)){const label=make('label',schema.title||key);const field=make(schema.enum?'select':(schema.maxLength>500?'textarea':'input'));field.name=key;field.required=contracts.input.required.includes(key);if(schema.maxLength)field.maxLength=schema.maxLength;if(schema.enum)for(const value of schema.enum){const option=make('option',value);option.value=value;field.append(option)}field.value=schema.default||'';label.append(field);$('fields').append(label)}}
$('task').addEventListener('submit',async event=>{event.preventDefault();$('submit').disabled=true;$('progress').textContent='';$('result').replaceChildren(make('div','正在运行…','card'));$('copy').disabled=true;$('download').disabled=true;let gotResult=false;
 try{const input=Object.fromEntries(new FormData(event.target));const response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)});if(!response.ok)throw Error((await response.json()).error);const reader=response.body.getReader(),decoder=new TextDecoder();let pending='';while(true){const {value,done}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});const lines=pending.split('\n');pending=lines.pop();for(const line of lines.filter(Boolean)){const item=JSON.parse(line);if(item.type==='progress')$('progress').textContent+=item.message+'\n';if(item.type==='error')throw Error(item.message);if(item.type==='result'){render(item.result);gotResult=true}}if(done)break}if(!gotResult)throw Error('连接中断，未收到完整结果，请重试。')}
 catch(error){showError(error.message)}finally{$('submit').disabled=false}});
$('check').onclick=async()=>{$('check').disabled=true;$('connection').textContent='正在检查…';try{const response=await fetch('/api/status');const d=await response.json();$('connection').textContent=Object.entries(d).map(([name,s])=>name+': '+(s.ok?(s.mode==='cached'?'使用缓存资料（未验证实时检索）':'已连接'):s.error)).join('\n');$('connection').style.whiteSpace='pre-wrap'}catch(e){$('connection').textContent=e.message}finally{$('check').disabled=false}};
$('latest').onclick=async()=>{try{const response=await fetch('/api/latest');const d=await response.json();if(!response.ok)throw Error(d.error);render(d)}catch(e){showError(e.message)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText([current.output.content.title,current.output.content.body,current.output.content.call_to_action].join('\n\n'));$('progress').textContent+='文案已复制\n'}catch{showError('浏览器未允许复制，请手动选择正文。')}};
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json;charset=utf-8'}));const a=make('a');a.href=url;a.download='门店销售方案.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
init().catch(e=>showError(e.message));
</script>
</html>
